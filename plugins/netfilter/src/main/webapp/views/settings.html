<div ng-controller="NetFilterSettingsController">

    <div class="alert alert-danger" ng-show="errorMessage">{{ errorMessage }}</div>
    <div class="alert alert-success" ng-show="successMessage">{{ successMessage }}</div>

    <form class="form-horizontal" ng-submit="save()">

        <div class="form-group">
            <label class="col-sm-3 control-label" localizedChangeTracking>plugin.netfilter.settings.enabled</label>
            <div class="col-sm-9">
                <input type="checkbox" ng-model="settings.enabled"/>
                <small class="text-muted" style="margin-left:8px;" localizedChangeTracking>plugin.netfilter.settings.enabled.hint</small>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label" localizedChangeTracking>plugin.netfilter.settings.mode</label>
            <div class="col-sm-9">
                <select class="form-control" style="max-width:260px;" ng-model="settings.filterMode">
                    <option value="BLOCKLIST" localizedChangeTracking>plugin.netfilter.mode.blocklist</option>
                    <option value="ALLOWLIST" localizedChangeTracking>plugin.netfilter.mode.allowlist</option>
                </select>
                <p class="help-block">
                    <span ng-show="settings.filterMode === 'BLOCKLIST'" localizedChangeTracking>plugin.netfilter.mode.blocklist.hint</span>
                    <span ng-show="settings.filterMode === 'ALLOWLIST'" localizedChangeTracking>plugin.netfilter.mode.allowlist.hint</span>
                </p>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-3 col-sm-9">
                <button type="submit" class="btn btn-primary" ng-disabled="loading" localizedChangeTracking>save</button>
            </div>
        </div>

    </form>

</div>
