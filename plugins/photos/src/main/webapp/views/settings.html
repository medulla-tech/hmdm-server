<!-- Localization completed -->
<div class="width-1000" ng-controller="PluginPhotosSettingsController">
    <div class="text-center">
        <h4 localized>plugin.photos.settings.title</h4>
    </div>

    <div>
        <form class='form-horizontal'>
            <div class='form-group'>
                <div ng-show='errorMessage' class='error'><span>{{errorMessage}}</span></div>
            </div>
            <div class='form-group'>
                <div ng-show='successMessage' class='success'><span>{{successMessage}}</span></div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.transfer.photos</label>
                <div class='col-sm-8'>
                    <input type='checkbox' ng-model='settings.transferPhotos'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.image.paths</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.imagePaths' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.exclude.paths</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.excludePaths' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.include.standard.paths</label>
                <div class='col-sm-8'>
                    <input type='checkbox' ng-model='settings.includeStandardPaths'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.non.image.extensions</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.nonImageExtensions' class='form-control'
                           localized-placeholder='plugin.photos.settings.non.image.extensions.placeholder'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.directory.structure</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.directoryStructure' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.file.name.template</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.fileNameTemplate' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.remove.old.files</label>
                <div class='col-sm-2'>
                    <input type='number' ng-model='settings.removeOldFiles' min='0' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.delete.images.on.devices</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.deleteImagesOnDevices' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.image.location</label>
                <div class='col-sm-8'>
                    <input type='checkbox' ng-model='settings.imageLocation'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.disable.location.warning</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.disableLocationWarning' class='form-control'
                           localized-placeholder='plugin.photos.settings.disable.location.warning.placeholder'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.add.label</label>
                <div class='col-sm-8'>
                    <input type='checkbox' ng-model='settings.addLabel'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.label.color</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.labelColor' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.background.color</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.backgroundColor' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.transparency</label>
                <div class='col-sm-8'>
                    <input type='range' ng-model='settings.transparency' min='0' max='100' class='form-control'/>
                    <span>{{settings.transparency}}</span>
                </div>
            </div>

            <div class='form-group'>
                <label class='col-sm-4 control-label' localized>plugin.photos.settings.label.text</label>
                <div class='col-sm-8'>
                    <input type='text' ng-model='settings.labelText' class='form-control'/>
                </div>
            </div>

            <div class='form-group'>
                <div class='col-sm-offset-4 col-sm-8'>
                    <button type='submit' class='btn btn-default' ng-click='save()' localized>button.save</button>
                </div>
            </div>

        </form>
    </div>
</div>
